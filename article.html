<!DOCTYPE html>
<html>
<head>
    <title>{{ article.title }} - Libra</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        .article-content {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin: 20px 0;
            line-height: 1.6;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin: 20px 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #2E7D32;
            border-radius: 2px;
        }
        .action-button {
            background: #2E7D32;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 30px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="margin: 20px 0;">
            <a href="/library" style="color: #2E7D32; text-decoration: none;">← К списку статей</a>
        </div>
        
        <div style="margin: 20px 0;">
            <span style="background: #E8F5E9; padding: 4px 12px; border-radius: 30px; color: #2E7D32; font-size: 14px;">
                {{ article.category }}
            </span>
        </div>
        
        <h1 style="font-size: 28px; margin-bottom: 10px;">{{ article.title }}</h1>
        <p style="color: #666; margin-bottom: 20px;">5 мин чтения • 12 прочтений</p>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="article-content">
            <p>{{ article.content }}</p>
            <p style="margin-top: 20px;">Это тестовая статья. Полная версия будет содержать весь твой контент из 100k слов.</p>
        </div>
        
        <button class="action-button" onclick="markAsRead()">
            ✅ Отметить прочитанным
        </button>
        
        <div style="display: flex; gap: 16px; margin: 20px 0;">
            <div style="flex: 1; text-align: center; padding: 12px; background: #f5f5f5; border-radius: 12px;">👍 24</div>
            <div style="flex: 1; text-align: center; padding: 12px; background: #f5f5f5; border-radius: 12px;">💬 3</div>
            <div style="flex: 1; text-align: center; padding: 12px; background: #f5f5f5; border-radius: 12px;">📤</div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <a href="/" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </a>
        <a href="/library" class="nav-item active">
            <span class="nav-icon">📚</span>
            <span>Библиотека</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">📊</span>
            <span>Статистика</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </a>
    </div>
    
    <script>
        function markAsRead() {
            alert('Статья отмечена прочитанной! +10 очков знаний');
            // Здесь будет логика сохранения прогресса
        }
        
        // Имитация прогресса чтения при скролле
        window.onscroll = function() {
            let scrollTop = window.scrollY;
            let docHeight = document.body.offsetHeight - window.innerHeight;
            let progress = (scrollTop / docHeight) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        };
    </script>
</body>
</html>
